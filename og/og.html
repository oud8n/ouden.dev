<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>og</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono:wght@400;500;700&display=swap"
			rel="stylesheet" />
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: #0a0a0a;
				color: #f5f5f5;
				font-family: 'JetBrains Mono', monospace;
			}

			.card {
				position: relative;
				width: 1200px;
				height: 630px;
				padding: 72px 80px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}

			.ascii {
				position: absolute;
				inset: 0;
				padding: 18px 22px;
				font-size: 18px;
				line-height: 22px;
				letter-spacing: 6px;
				white-space: pre;
				color: rgb(245 245 245 / 0.07);
				overflow: hidden;
			}

			.ascii b {
				font-weight: 400;
				color: rgb(255 59 48 / 0.22);
			}

			.top,
			.bottom {
				position: relative;
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-size: 24px;
				color: rgb(245 245 245 / 0.62);
			}

			.brand {
				font-weight: 700;
				color: #f5f5f5;
			}

			.brand span {
				color: #ff3b30;
			}

			.main {
				position: relative;
			}

			h1 {
				font-family: 'Inter', sans-serif;
				font-size: 148px;
				font-weight: 800;
				letter-spacing: -0.04em;
				line-height: 1;
			}

			h1 span {
				color: #ff3b30;
			}

			.role {
				margin-top: 22px;
				font-size: 34px;
				color: rgb(245 245 245 / 0.78);
			}

			.stack {
				margin-top: 14px;
				font-size: 26px;
				color: rgb(245 245 245 / 0.5);
			}

			.pill {
				padding: 10px 20px;
				border: 2px solid rgb(245 245 245 / 0.34);
				color: #f5f5f5;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="ascii" id="ascii"></div>
			<div class="top">
				<span class="brand"><span>{</span> ouden <span>}</span></span>
				<span>@oud8n</span>
			</div>
			<div class="main">
				<h1>Ouden<span>.</span></h1>
				<p class="role">fullstack developer</p>
				<p class="stack">Go · TypeScript · React · NestJS · PostgreSQL</p>
			</div>
			<div class="bottom">
				<span>Netherlands · CET · remote</span>
				<span class="pill">open to work</span>
			</div>
		</div>
		<script>
			const chars = ' .:+*x#'
			const cols = 74
			const rows = 28
			let out = ''
			for (let y = 0; y < rows; y++) {
				for (let x = 0; x < cols; x++) {
					const dx = (x - cols * 0.78) / 1.6
					const dy = y - rows * 0.5
					const r = Math.sqrt(dx * dx + dy * dy)
					const v = (Math.sin(r * 0.55) + 1) / 2
					const fade = Math.min(1, Math.max(0, (x - cols * 0.35) / (cols * 0.25)))
					const i = Math.floor(v * fade * (chars.length - 1))
					const c = chars[i]
					out += c === '#' || c === 'x' ? `<b>${c}</b>` : c
				}
				out += '\n'
			}
			document.getElementById('ascii').innerHTML = out
		</script>
	</body>
</html>
